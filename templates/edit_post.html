
{% extends "base.html" %}

{% block content %}

    <h1>Edit Post</h1>

    <form
        action="{{ url_for('edit_post', post_id=post.id) }}"
        method="POST"
    >

        <div>
            <label for="content">Your post</label>
        </div>

        <div>
            <textarea
                id="content"
                name="content"
                rows="5"
                cols="50"
                required
            >{{ post.content }}</textarea>
        </div>

        <div>
            <label for="location_id">Location</label>

            <select id="location_id" name="location_id" required>

                <option value="">Select a location</option>

                {% for location in locations %}

                    <option
                        value="{{ location.id }}"
                        {% if location.id == post.location_id %}selected{% endif %}
                    >
                        {{ location.name }} — {{ location.city }}, {{ location.country }}
                    </option>

                {% endfor %}

            </select>
        </div>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">
        Cancel
    </a>

{% endblock %}
