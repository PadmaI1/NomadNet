{% extends "base.html" %}

{% block title %}Login — NomadNet{% endblock %}

{% block content %}

<div class="max-w-md mx-auto w-full px-margin-mobile lg:px-margin py-16 lg:py-24">

    <div class="p-8 sm:p-10 rounded-2xl bg-surface-container-lowest shadow-sm flex flex-col gap-6">
        <div class="flex flex-col gap-1 text-center">
            <span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest font-bold">Welcome Back</span>
            <h1 class="font-headline-xl text-headline-xl text-primary font-bold tracking-tight">Login to NomadNet</h1>
        </div>

        <form method="POST" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="flex flex-col gap-1.5">
                <label for="username" class="font-label-md text-label-md text-on-surface-variant">Username</label>
                <input type="text" id="username" name="username" class="w-full rounded-full border border-outline-variant bg-surface-container-low px-4 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="password" class="font-label-md text-label-md text-on-surface-variant">Password</label>
                <input type="password" id="password" name="password" class="w-full rounded-full border border-outline-variant bg-surface-container-low px-4 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary">
            </div>

            <button type="submit" class="w-full mt-2 py-3 rounded-full bg-secondary hover:bg-tertiary-container text-on-secondary font-label-lg text-label-lg transition-colors">Login</button>
        </form>

        <p class="font-body-sm text-body-sm text-on-surface-variant text-center m-0">New to NomadNet? <a href="{{ url_for('auth.signup') }}" class="text-secondary font-semibold hover:underline">Create an account</a></p>
    </div>

</div>

{% endblock %}
